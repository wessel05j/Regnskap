{% macro confirm_modal(modal_id='confirm-modal') -%}
<div id="{{ modal_id }}" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
    <div class="absolute inset-0 bg-slate-900/50" data-modal-close></div>
    <div class="relative z-10 w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl" role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title">
        <h2 id="{{ modal_id }}-title" class="text-lg font-semibold text-slate-900">Bekreft handling</h2>
        <p id="{{ modal_id }}-message" class="mt-2 text-sm text-slate-600">Er du sikker?</p>
        <div class="mt-6 flex flex-wrap items-center justify-end gap-3">
            <button type="button" class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" data-modal-cancel>
                Avbryt
            </button>
            <button type="button" class="inline-flex items-center justify-center rounded-lg bg-rose-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-rose-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-600" data-modal-confirm>
                Bekreft
            </button>
        </div>
    </div>
</div>
{%- endmacro %}
